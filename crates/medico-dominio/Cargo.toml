[package]
name = "medico-dominio"
description = "Reglas del dominio de medico que no tocan la base: ámbito de visibilidad y roles."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
# Para leer el mapeo CIE-10/CIE-11 empotrado (`cie11.rs`). Sigue sin tocar la
# base ni la red: `include_str!` es del compilador, y parsear una cadena es
# cómputo puro como el resto de este crate.
serde_json = { workspace = true }
# Fechas del RIPS. Las dos formas —con hora sin segundos y sin hora— son reglas
# del documento, así que se formatean aquí y no en la capa que habla con la base.
chrono = { workspace = true }
