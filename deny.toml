# cargo-deny — control de cadena de suministro (lección Atomic Arch, #143).
# Complementa a cargo-audit: además de CVEs conocidos, exige que TODA dependencia
# venga de una fuente autorizada (crates.io o nuestros repos git), prohíbe
# comodines de versión y controla licencias. No es cargo-vet (revisión al
# cambiar): es el baseline correcto para una app interna (ver
# conocimiento/cargo_vet_reconsiderado.md).

[advisories]
version = 2
# rsa/Marvin (RUSTSEC-2023-0071): cargo-deny NO lo marca con la advisory-db actual;
# cargo-audit sí, y allí se ignora en .cargo/audit.toml con justificación (entra por
# sqlx-macros-core para el macro migrate!, inalcanzable con SQLite). Si cargo-deny
# empezara a marcarlo, se añade el ignore aquí también.

[licenses]
version = 2
# Allowlist AJUSTADA al árbol real (directiva 23): una licencia NUEVA en un bump
# = rojo, y se decide a mano si entra. No se pre-aprueban licencias ausentes.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # Nuestras propias librerías (guaca, quipu, quipu-nucleo) y los crates del
    # workspace (medico-*). AGPL es de casa; hay licencia comercial aparte.
    "AGPL-3.0-or-later",
    "LicenseRef-Propietario",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"   # avisa de versiones duplicadas (superficie + peso)
wildcards = "deny"           # prohíbe version = "*" en deps EXTERNAS
allow-wildcard-paths = true  # …pero no en los deps internos por `path` (son nuestros)

[sources]
# El corazón anti-Atomic-Arch: una dep desde una fuente inesperada = rojo.
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/isazajuancarlos/guaca"]
