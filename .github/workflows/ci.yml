# CI de medico, a mitad de migración: el backend Python sigue siendo el producto
# vivo y el workspace Rust crece al lado. El CI cubre LOS DOS —además del
# frontend—: probar solo el Rust dejaría sin red el producto real, que es el
# error inverso al que informes tuvo (probar solo el Python y no el port).
name: CI

# CADA COMMIT SE PRUEBA UNA VEZ, no dos.
#
# Antes esto decía `push: branches: ["**"]` junto a `pull_request`, y una rama
# con PR abierto disparaba LOS DOS eventos sobre el mismo commit: los cinco
# checks corrían por duplicado. Se veía en `gh pr checks`, con dos identificadores
# de ejecución por check y el mismo resultado. En un repositorio PRIVADO eso no es
# solo ruido — los minutos de Actions se facturan, y el trabajo de Rust son entre
# 3 y 4½ minutos por corrida.
#
# `push` se queda SOLO en `main`, que es lo que verifica el commit de fusión —el
# resultado de un squash no lo ha probado nadie hasta que existe—. Las ramas de
# trabajo las cubre `pull_request`, que además vuelve a correr en cada empuje a la
# rama mientras el PR está abierto (`synchronize`).
#
# LO QUE ESTO DEJA FUERA, dicho para que no sorprenda: una rama empujada SIN PR ya
# no tiene CI. Es deliberado — el flujo de este repositorio es rama → PR → merge,
# y la protección de `main` exige el PR de todos modos, así que no hay camino por
# el que un commit llegue a `main` sin haber pasado por aquí.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un empuje nuevo CANCELA la corrida anterior de la misma referencia. Sin esto,
# corregir un PR tres veces seguidas deja tres corridas compitiendo y solo la
# última importa. En `main` no se cancela: cada commit de esa rama es un estado
# publicado y su resultado tiene que quedar registrado.
concurrency:
  # El `-{sha}` en `main` NO es adorno: `cancel-in-progress: false` solo salva a
  # la corrida EN CURSO — GitHub cancela las ENCOLADAS del mismo grupo. Con dos
  # merges dentro de una ventana de CI, el commit de en medio no se medía jamás
  # y la rama se veía verde por la corrida siguiente.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  # Menor privilegio (supply-chain #203): este CI solo prueba, con checkout de
  # solo lectura. Sin este bloque el GITHUB_TOKEN hereda permisos amplios.
  contents: read

jobs:
  rust:
    name: rust (test + clippy)
    runs-on: ubuntu-latest
    # El techo, no la duración esperada. Máximos medidos por JOB
    # sobre las 6 últimas corridas de `main` (2026-08-06): rust 6,1 min
    # —el reparto entero es 4,4 · 5,5 · 5,6 · 5,6 · 5,8 · 6,1—, pytest 3,
    # front 1, audit y deny 0. 20 deja 3,3x de margen en el más pesado:
    # holgura de sobra para que no salte por operación normal
    # (directiva 21) y estrechez suficiente para ver una deriva.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Cabeceras de SQLite
        # `libsqlite3-sys` (0.30) enlaza el SQLite del sistema, no bundled: sin
        # las cabeceras de desarrollo la compilación no encuentra sqlite3.h.
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (el CI usa -D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Pruebas del workspace
        run: cargo test --workspace --all-targets

  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    # El techo, no la duración esperada. Máximos medidos por JOB
    # sobre las 6 últimas corridas de `main` (2026-08-06): rust 6,1 min
    # —el reparto entero es 4,4 · 5,5 · 5,6 · 5,6 · 5,8 · 6,1—, pytest 3,
    # front 1, audit y deny 0. 20 deja 3,3x de margen en el más pesado:
    # holgura de sobra para que no salte por operación normal
    # (directiva 21) y estrechez suficiente para ver una deriva.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Dependencias (el freeze del venv que funciona)
        # requirements-recuperado.txt es el freeze completo del entorno que
        # corre las pruebas; backend/requirements.txt no trae las herramientas
        # de prueba (pytest).
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-recuperado.txt
      - name: Pruebas
        # conftest.py fija DATABASE_URL a una SQLite temporal antes de importar
        # nada: la suite es autocontenida, no toca ninguna base real.
        working-directory: backend
        run: pytest -q

  frontend:
    name: frontend (build + test)
    runs-on: ubuntu-latest
    # El techo, no la duración esperada. Máximos medidos por JOB
    # sobre las 6 últimas corridas de `main` (2026-08-06): rust 6,1 min
    # —el reparto entero es 4,4 · 5,5 · 5,6 · 5,6 · 5,8 · 6,1—, pytest 3,
    # front 1, audit y deny 0. 20 deja 3,3x de margen en el más pesado:
    # holgura de sobra para que no salte por operación normal
    # (directiva 21) y estrechez suficiente para ver una deriva.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar
        working-directory: frontend
        run: npm ci
      - name: Construir la interfaz
        working-directory: frontend
        run: npx ng build
      - name: Pruebas (vitest vía ng test)
        working-directory: frontend
        run: npx ng test --watch=false

  auditoria-deps:
    name: cargo-audit (RustSec)
    runs-on: ubuntu-latest
    # El techo, no la duración esperada. Máximos medidos por JOB
    # sobre las 6 últimas corridas de `main` (2026-08-06): rust 6,1 min
    # —el reparto entero es 4,4 · 5,5 · 5,6 · 5,6 · 5,8 · 6,1—, pytest 3,
    # front 1, audit y deny 0. 20 deja 3,3x de margen en el más pesado:
    # holgura de sobra para que no salte por operación normal
    # (directiva 21) y estrechez suficiente para ver una deriva.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # RustSec: falla si alguna dependencia tiene un CVE publicado. El único
      # ignore vive en .cargo/audit.toml, preciso y justificado. Cierra OWASP
      # A03 (Software Supply Chain Failures). La lección de Ubuntu Forums (2016):
      # el hueco entró por un componente de terceros sin parchear.
      - name: cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  cadena-suministro:
    name: cargo-deny (supply chain)
    runs-on: ubuntu-latest
    # El techo, no la duración esperada. Máximos medidos por JOB
    # sobre las 6 últimas corridas de `main` (2026-08-06): rust 6,1 min
    # —el reparto entero es 4,4 · 5,5 · 5,6 · 5,6 · 5,8 · 6,1—, pytest 3,
    # front 1, audit y deny 0. 20 deja 3,3x de margen en el más pesado:
    # holgura de sobra para que no salte por operación normal
    # (directiva 21) y estrechez suficiente para ver una deriva.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # cargo-deny endurece la cadena de suministro más allá de los CVEs: exige
      # que TODA dependencia venga de una fuente autorizada (crates.io o nuestro
      # git), prohíbe comodines de versión externos y controla licencias. Es la
      # defensa contra que una dep se traiga desde una fuente inesperada — el
      # vector del ataque Atomic Arch a AUR. Config en deny.toml.
      - name: cargo-deny
        run: |
          cargo install cargo-deny --locked
          cargo deny check
