version: '3.8'

# ==============================================================================
# MED-SYS PRO v2.0 - Docker Compose
# Arquitectura: PostgreSQL + FastAPI Backend + Angular Frontend (Nginx)
# Uso: docker compose up -d
#
# ESTA PILA ES EL BACKEND PYTHON, que se retira con el port a Rust (#156). El
# producto que se entrega es el binario de `crates/medico-api`; esto queda como
# implementación de referencia mientras se porta RIPS.
#
# LOS TRES SECRETOS SE EXIGEN DEL ENTORNO Y NO TIENEN VALOR POR DEFECTO. Hasta
# hoy venían escritos aquí, así que `docker compose up -d` —el comando que el
# CLAUDE.md documenta como «pila completa»— levantaba el backend firmando JWT con
# una clave que está en el repositorio, sin que el operador hiciera nada. La
# sintaxis `${VAR:?mensaje}` hace que compose ABORTE si falta, que es lo que debe
# pasar: un secreto ausente para el arranque, nunca uno de relleno.
#
#   export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
#   export SECRET_KEY="$(openssl rand -hex 32)"
#   export JWT_SECRET_KEY="$(openssl rand -hex 32)"
#   docker compose up -d
# ==============================================================================

services:
  # --- Base de datos PostgreSQL ---
  db:
    image: postgres:16-alpine
    container_name: medsys-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: medsys_db
      POSTGRES_USER: medsys_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD (exportela; no hay valor por defecto)}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - medsys_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medsys_user -d medsys_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Backend FastAPI ---
  backend:
    build: ./backend
    container_name: medsys-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://medsys_user:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}@db:5432/medsys_db
      SECRET_KEY: ${SECRET_KEY:?falta SECRET_KEY (firma las sesiones; genere 32+ bytes)}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?falta JWT_SECRET_KEY (firma los tokens; genere 32+ bytes)}
    ports:
      - "8000:8000"
    volumes:
      - medsys_uploads:/app/../uploads
      - medsys_logs:/app/logs

  # --- Frontend Angular (Nginx) ---
  frontend:
    build: ./frontend
    container_name: medsys-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  medsys_pgdata:
    driver: local
  medsys_uploads:
    driver: local
  medsys_logs:
    driver: local
