version: '3.8'

# ==============================================================================
# MED-SYS PRO v2.0 - Docker Compose
# Arquitectura: PostgreSQL + FastAPI Backend + Angular Frontend (Nginx)
# Uso: docker compose up -d
# ==============================================================================

services:
  # --- Base de datos PostgreSQL ---
  db:
    image: postgres:16-alpine
    container_name: medsys-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: medsys_db
      POSTGRES_USER: medsys_user
      POSTGRES_PASSWORD: MedSys2026Secure!
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - medsys_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medsys_user -d medsys_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Backend FastAPI ---
  backend:
    build: ./backend
    container_name: medsys-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://medsys_user:MedSys2026Secure!@db:5432/medsys_db
      SECRET_KEY: medsys_docker_secret_key_cambie_en_produccion_2026
      JWT_SECRET_KEY: medsys_jwt_secret_cambie_en_produccion_2026_muy_largo
    ports:
      - "8000:8000"
    volumes:
      - medsys_uploads:/app/../uploads
      - medsys_logs:/app/logs

  # --- Frontend Angular (Nginx) ---
  frontend:
    build: ./frontend
    container_name: medsys-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  medsys_pgdata:
    driver: local
  medsys_uploads:
    driver: local
  medsys_logs:
    driver: local
